name: vnet_agenda
description: "app hibrida para agendar pedidos de instalacion de fibra optica."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2 
  flutter_secure_storage: ^8.0.0
  universal_io: ^2.2.0  # Para detectar la plataforma
  dotenv: ^4.2.0         # Para manejar variables de entorno
  http: ^1.1.0
  logger: ^2.2.0
  flutter_map: ^5.0.0
  latlong2: ^0.9.1
  date_time_picker: ^2.1.0
  url_launcher: ^6.1.11
  geolocator: ^10.0.0
  intl: ^0.17.0
  syncfusion_flutter_signaturepad: ^31.1.19
  path_provider: ^2.1.1
  signature: ^5.0.0
  connectivity_plus: ^4.0.0
  open_filex: ^4.4.0
  image: ^4.0.15
  http_parser: ^4.0.2
  permission_handler: ^11.3.1

  
dev_dependencies:
  flutter_lints: ^2.0.0
  

flutter:
  assets:
    - assets/images/image001.png
    - assets/images/image002.png
  uses-material-design: true

